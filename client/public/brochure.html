<!doctype html>
<html lang="en">

<head>
    <title>Brochure</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS v5.2.1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <div class="catalog-app">
        <div id="viewer">
            <div id="flipbook" class="ui-flipbook">
                <!-- Pages will be generated dynamically by JavaScript -->
            </div>
        </div>

        <!-- controls -->
        <div id="controls">
            <div class="all">
                <div class="ui-slider" id="page-slider">
                    <div class="bar">
                        <div class="progress-width">
                            <div class="progress">
                                <div class="handler"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="ui-options" id="options">
                    <a class="ui-icon" id="ui-icon-table-contents">
                        <i class="fa fa-bars"></i>
                    </a>
                    <a class="ui-icon show-hint" title="Miniatures" id="ui-icon-miniature">
                        <i class="fa fa-th"></i>
                    </a>
                    <a class="ui-icon" id="ui-icon-zoom">
                        <i class="fa fa-file-o"></i>
                    </a>
                    <a class="ui-icon show-hint" title="Share" id="ui-icon-share">
                        <i class="fa fa-share"></i>
                    </a>
                    <a class="ui-icon show-hint" title="Full Screen" id="ui-icon-full-screen">
                        <i class="fa fa-expand"></i>
                    </a>
                    <a class="ui-icon show-hint" id="ui-icon-toggle">
                        <i class="fa fa-ellipsis-v"></i>
                    </a>
                </div>

                <!-- zoom slider -->
                <div id="zoom-slider-view" class="zoom-slider">
                    <div class="bg">
                        <div class="ui-slider" id="zoom-slider">
                            <div class="bar">
                                <div class="progress-width">
                                    <div class="progress">
                                        <div class="handler"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- / zoom slider -->
            </div>

            <div id="ui-icon-expand-options">
                <a class="ui-icon show-hint">
                    <i class="fa fa-ellipsis-h"></i>
                </a>
            </div>

        </div>
        <!-- / controls -->

        <!-- miniatures -->
        <div id="miniatures" class="ui-miniatures-slider">

        </div>
        <!-- / miniatures -->
        <!-- Bootstrap JavaScript Libraries -->
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"></script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"></script>
        <script src="https://code.jquery.com/jquery-2.0.3.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.9.1/underscore-min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.4.0/backbone-min.js"></script>
        <script src="./assets/js/turn.js"></script>
        <script src="./assets/js/config.js"></script>
        <script src="./assets/js/brochure-generator.js"></script>
        <script>
            $(function () {
                // Initialize the brochure generator with configuration
                const brochure = new BrochureGenerator(BrochureConfig);

                // Make brochure instance globally available for debugging
                window.brochure = brochure;

                // Log initialization
                console.log('Brochure initialized successfully');
                console.log('Configuration:', BrochureConfig);
                console.log('To change page count, edit config.js or use: brochure.updatePageCount(newCount)');
                console.log('To change cover pages, edit config.js or use: brochure.updateCoverPages([1, lastPage])');

                // Example usage (uncomment to test):
                // brochure.updatePageCount(60);
                // brochure.updateCoverPages([1, 60]);
            });
        </script>
</body>

</html>
